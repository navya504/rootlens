spring.application.name=rootlens
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=RootLens
info.app.description=Local-first RCA workbench
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{28} - %msg%n
rootlens.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
rootlens.ollama.embedding-model=${ROOTLENS_EMBEDDING_MODEL:qwen3-embedding:0.6b}
rootlens.ollama.chat-model=${ROOTLENS_CHAT_MODEL:qwen3:4b}
rootlens.vector.path=${ROOTLENS_VECTOR_PATH:.rootlens/code-vectors.tsv}
